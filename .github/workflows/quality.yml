name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Reproduction package gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.32
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install exact Python
        run: uv python install 3.14.6

      - name: Synchronize exact environment
        run: uv sync --all-groups --extra torch --extra mlx --locked

      - name: Format, lint, and type check
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync ty check --error-on-warning src tests tools benchmarks

      - name: Integration tests
        run: uv run --no-sync pytest -q

      - name: Build source distribution and wheel
        run: uv build
