[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[project]
name = "discrete-dividend-option-pricing"
version = "0.1.0"
description = "Reproducible research workflows for discrete-dividend option pricing"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jørgen Sandhaug" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "finoptions-engine>=0.1.0,<0.2",
  "numpy>=2.5.1,<3",
  "polars>=1.42.1,<2",
  "safetensors>=0.8.0,<0.9",
]

[project.optional-dependencies]
mlx = [
  "mlx==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx[cpu]==0.32.0; sys_platform == 'linux'",
]
torch = [
  "torch==2.13.0",
]

[dependency-groups]
dev = [
  "maturin==1.14.1",
  "pytest==9.1.1",
  "ruff==0.15.21",
  "ty==0.0.59",
]

[tool.uv.sources]
finoptions-engine = { path = "../finoptions-engine", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-name = "discrete_dividend_study"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # formatter owns trailing commas
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tools/dev.py" = ["S603"] # commands are fixed argv lists; no shell is used

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "error"
